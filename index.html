<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal To-Do List</title>
  <style>
    /* ----------------------------------------------------
       CSS Custom Properties (Theme & Variables)
       Supports both light and dark mode automatically
    ----------------------------------------------------- */
    :root {
      --color-bg: #f4f6f8;
      --color-card: #ffffff;
      --color-text: #1f2937;
      --color-text-muted: #6b7280;
      --color-primary: #4f46e5;
      --color-primary-hover: #4338ca;
      --color-primary-focus: rgba(79, 70, 229, 0.25);
      --color-border: #e5e7eb;
      --color-border-input: #d1d5db;
      --color-danger: #ef4444;
      --color-danger-hover: #dc2626;
      --color-danger-bg: #fee2e2;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0f172a;
        --color-card: #1e293b;
        --color-text: #f8fafc;
        --color-text-muted: #94a3b8;
        --color-primary: #6366f1;
        --color-primary-hover: #818cf8;
        --color-primary-focus: rgba(99, 102, 241, 0.35);
        --color-border: #334155;
        --color-border-input: #475569;
        --color-danger: #f87171;
        --color-danger-hover: #ef4444;
        --color-danger-bg: rgba(239, 68, 68, 0.15);
      }
    }

    /* ----------------------------------------------------
       Base Resets & Layout
    ----------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    /* Screen-reader only utility */
    .visually-hidden {
      position: absolute;
      clip-path: inset(50%);
      overflow: hidden;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      border: 0;
      white-space: nowrap;
    }

    /* ----------------------------------------------------
       App Container & Header
    ----------------------------------------------------- */
    .app-container {
      width: 100%;
      max-width: 520px;
      background-color: var(--color-card);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
    }

    header {
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      margin-top: 0.25rem;
    }

    /* ----------------------------------------------------
       Add Task Form
    ----------------------------------------------------- */
    .todo-form {
      margin-bottom: 1.5rem;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
    }

    .todo-input {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1.5px solid var(--color-border-input);
      border-radius: var(--radius-md);
      background-color: var(--color-card);
      color: var(--color-text);
      min-height: 48px; /* Accessible touch target size */
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .todo-input:focus-visible {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-focus);
    }

    .btn-submit {
      padding: 0 1.25rem;
      min-height: 48px;
      background-color: var(--color-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .btn-submit:hover {
      background-color: var(--color-primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    /* ----------------------------------------------------
       Filter & Toolbar
    ----------------------------------------------------- */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 1rem;
    }

    .filter-buttons {
      display: flex;
      background-color: var(--color-bg);
      padding: 0.25rem;
      border-radius: var(--radius-md);
      gap: 0.25rem;
    }

    .btn-filter {
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-text-muted);
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-filter:hover {
      color: var(--color-text);
    }

    .btn-filter[aria-pressed="true"] {
      background-color: var(--color-card);
      color: var(--color-primary);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
    }

    .btn-filter:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 1px;
    }

    .items-left {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      font-weight: 500;
    }

    /* ----------------------------------------------------
       Task List
    ----------------------------------------------------- */
    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background-color: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .todo-item:hover {
      border-color: var(--color-border-input);
      background-color: var(--color-bg);
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--color-text-muted);
      opacity: 0.75;
    }

    .todo-label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      cursor: pointer;
      min-height: 32px;
      word-break: break-word;
    }

    /* Custom Checkbox */
    .todo-checkbox {
      width: 1.25rem;
      height: 1.25rem;
      min-width: 1.25rem;
      accent-color: var(--color-primary);
      cursor: pointer;
    }

    .todo-checkbox:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .todo-text {
      font-size: 0.95rem;
      line-height: 1.4;
      transition: color 0.2s ease, text-decoration 0.2s ease;
    }

    /* Delete Button */
    .btn-delete {
      width: 36px;
      height: 36px;
      min-width: 36px;
      background: transparent;
      border: none;
      color: var(--color-text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .btn-delete:hover {
      color: var(--color-danger);
      background-color: var(--color-danger-bg);
    }

    .btn-delete:focus-visible {
      outline: 2px solid var(--color-danger);
      outline-offset: 1px;
    }

    /* ----------------------------------------------------
       Footer Actions & Empty State
    ----------------------------------------------------- */
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--color-text-muted);
      font-size: 0.95rem;
    }

    .list-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 1rem;
      padding-top: 0.75rem;
    }

    .btn-clear {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-sm);
    }

    .btn-clear:hover {
      color: var(--color-danger);
    }

    .btn-clear:focus-visible {
      outline: 2px solid var(--color-danger);
    }
  </style>
</head>
<body>
  <main class="app-container">
    <!-- Header -->
    <header>
      <h1>📝 To-Do List</h1>
      <p class="subtitle">Keep track of what matters today</p>
    </header>

    <!-- Accessible Form to Add Tasks -->
    <form id="todo-form" class="todo-form">
      <div class="input-group">
        <label for="todo-input" class="visually-hidden">Task description</label>
        <input 
          type="text" 
          id="todo-input" 
          class="todo-input" 
          placeholder="What needs to be done?" 
          autocomplete="off" 
          maxlength="200" 
          required
        >
        <button type="submit" class="btn-submit">Add Task</button>
      </div>
    </form>

    <!-- Toolbar: Filter Buttons & Task Count -->
    <section class="toolbar" aria-label="Task filters and status">
      <span id="items-left" class="items-left">0 items left</span>

      <div class="filter-buttons" role="group" aria-label="Filter tasks">
        <button type="button" class="btn-filter" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="btn-filter" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" class="btn-filter" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
    </section>

    <!-- To-Do List Items -->
    <ul id="todo-list" class="todo-list" aria-label="Tasks list">
      <!-- Dynamically rendered via JavaScript -->
    </ul>

    <!-- Empty State Message -->
    <div id="empty-state" class="empty-state" hidden>
      No tasks here yet. Add a new task above!
    </div>

    <!-- Footer Action: Clear Completed -->
    <div id="list-footer" class="list-footer" hidden>
      <button type="button" id="btn-clear-completed" class="btn-clear">
        Clear completed
      </button>
    </div>
  </main>

  <!-- Live Region for Screen Reader Announcements -->
  <div id="status-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <script>
    /* ====================================================
       JavaScript Application Logic
       - State management (tasks array, current filter)
       - LocalStorage persistence
       - DOM rendering & event delegation
    ==================================================== */

    const STORAGE_KEY = 'tlf1_todos_v1';

    // State
    let todos = loadTodos();
    let currentFilter = 'all';

    // DOM Elements
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');
    const itemsLeft = document.getElementById('items-left');
    const emptyState = document.getElementById('empty-state');
    const listFooter = document.getElementById('list-footer');
    const btnClearCompleted = document.getElementById('btn-clear-completed');
    const filterButtons = document.querySelectorAll('.btn-filter');
    const liveRegion = document.getElementById('status-live');

    /* ----------------------------------------------------
       Persistence Helpers (localStorage)
    ----------------------------------------------------- */
    function loadTodos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [
          { id: '1', text: 'Welcome to your to-do list! 👋', completed: false },
          { id: '2', text: 'Check the box to complete a task', completed: false },
          { id: '3', text: 'Click ✕ on the right to delete', completed: true }
        ];
      } catch (err) {
        console.error('Failed to load tasks from localStorage:', err);
        return [];
      }
    }

    function saveTodos() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (err) {
        console.error('Failed to save tasks to localStorage:', err);
      }
    }

    /* ----------------------------------------------------
       Accessibility Announcement Helper
    ----------------------------------------------------- */
    function announce(message) {
      if (!liveRegion) return;
      liveRegion.textContent = '';
      // Brief timeout ensures screen readers detect text change
      setTimeout(() => {
        liveRegion.textContent = message;
      }, 50);
    }

    /* ----------------------------------------------------
       Core Actions: Add, Toggle, Delete, Clear
    ----------------------------------------------------- */
    function addTodo(text) {
      const cleanText = text.trim();
      if (!cleanText) return;

      const newTodo = {
        id: Date.now().toString(),
        text: cleanText,
        completed: false
      };

      todos.unshift(newTodo);
      saveTodos();
      render();
      announce(`Task "${cleanText}" added.`);
    }

    function toggleTodo(id) {
      const todo = todos.find(item => item.id === id);
      if (!todo) return;

      todo.completed = !todo.completed;
      saveTodos();
      render();
      announce(`Task "${todo.text}" marked as ${todo.completed ? 'completed' : 'active'}.`);
    }

    function deleteTodo(id) {
      const index = todos.findIndex(item => item.id === id);
      if (index === -1) return;

      const [removed] = todos.splice(index, 1);
      saveTodos();
      render();
      announce(`Task "${removed.text}" deleted.`);
    }

    function clearCompleted() {
      const count = todos.filter(t => t.completed).length;
      if (count === 0) return;

      todos = todos.filter(t => !t.completed);
      saveTodos();
      render();
      announce(`Cleared ${count} completed ${count === 1 ? 'task' : 'tasks'}.`);
    }

    /* ----------------------------------------------------
       Filter Management
    ----------------------------------------------------- */
    function setFilter(filter) {
      currentFilter = filter;
      filterButtons.forEach(btn => {
        const isCurrent = btn.dataset.filter === filter;
        btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
      });
      render();
    }

    /* ----------------------------------------------------
       Render Function (Updates the UI based on state)
    ----------------------------------------------------- */
    function render() {
      // 1. Filter tasks
      const filteredTodos = todos.filter(todo => {
        if (currentFilter === 'active') return !todo.completed;
        if (currentFilter === 'completed') return todo.completed;
        return true;
      });

      // 2. Render List Items
      todoList.innerHTML = '';
      filteredTodos.forEach(todo => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
        li.dataset.id = todo.id;

        // Label + Checkbox wrapper
        const label = document.createElement('label');
        label.className = 'todo-label';
        label.htmlFor = `checkbox-${todo.id}`;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `checkbox-${todo.id}`;
        checkbox.className = 'todo-checkbox';
        checkbox.checked = todo.completed;

        const textSpan = document.createElement('span');
        textSpan.className = 'todo-text';
        textSpan.textContent = todo.text; // Safe: textContent prevents XSS injection

        label.appendChild(checkbox);
        label.appendChild(textSpan);

        // Delete button
        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'btn-delete';
        deleteBtn.setAttribute('aria-label', `Delete task: ${todo.text}`);
        deleteBtn.textContent = '✕';

        li.appendChild(label);
        li.appendChild(deleteBtn);
        todoList.appendChild(li);
      });

      // 3. Update active items counter
      const activeCount = todos.filter(t => !t.completed).length;
      itemsLeft.textContent = `${activeCount} ${activeCount === 1 ? 'item' : 'items'} left`;

      // 4. Update empty state visibility
      if (filteredTodos.length === 0) {
        emptyState.hidden = false;
        if (currentFilter === 'completed') {
          emptyState.textContent = 'No completed tasks yet.';
        } else if (currentFilter === 'active') {
          emptyState.textContent = 'No active tasks! You are all caught up.';
        } else {
          emptyState.textContent = 'No tasks yet. Add a new task above!';
        }
      } else {
        emptyState.hidden = true;
      }

      // 5. Update Clear Completed button visibility
      const completedCount = todos.filter(t => t.completed).length;
      listFooter.hidden = completedCount === 0;
    }

    /* ----------------------------------------------------
       Event Listeners
    ----------------------------------------------------- */

    // Form submission: adding a new task
    form.addEventListener('submit', (e) => {
      e.preventDefault(); // Prevent page reload on submit
      addTodo(input.value);
      input.value = '';
      input.focus();
    });

    // Delegated click & change events on the todo list for performance & CSP compliance
    todoList.addEventListener('change', (e) => {
      if (e.target.classList.contains('todo-checkbox')) {
        const item = e.target.closest('.todo-item');
        if (item) {
          toggleTodo(item.dataset.id);
        }
      }
    });

    todoList.addEventListener('click', (e) => {
      if (e.target.classList.contains('btn-delete')) {
        const item = e.target.closest('.todo-item');
        if (item) {
          deleteTodo(item.dataset.id);
        }
      }
    });

    // Filter button clicks
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        setFilter(btn.dataset.filter);
      });
    });

    // Clear completed button click
    btnClearCompleted.addEventListener('click', () => {
      clearCompleted();
    });

    // Initial render on page load
    render();
  </script>
</body>
</html>
